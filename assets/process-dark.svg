<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 164" width="1200" height="164"><style>@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.in{animation:in .6s ease-out both}</style><line x1="120" y1="40" x2="1080" y2="40" stroke="#30363D" stroke-width="2"/><g class="in" style="animation-delay:0.00s"><circle cx="120" cy="40" r="26" fill="#0D1117" stroke="#3FB950" stroke-width="2"/><text x="120" y="50" font-size="26" font-weight="700" fill="#3FB950" font-family="Georgia, Times New Roman, serif" text-anchor="middle" xml:space="preserve" >1</text><text x="120" y="104" font-size="21" font-weight="700" fill="#E6EDF3" font-family="Georgia, Times New Roman, serif" text-anchor="middle" xml:space="preserve" >Understand</text><text x="120" y="130" font-size="16" font-weight="400" fill="#9198A1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve" >I listen first and ask</text><text x="120" y="152" font-size="16" font-weight="400" fill="#9198A1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve" >the awkward questions</text></g><g class="in" style="animation-delay:0.12s"><circle cx="360" cy="40" r="26" fill="#0D1117" stroke="#3FB950" stroke-width="2"/><text x="360" y="50" font-size="26" font-weight="700" fill="#3FB950" font-family="Georgia, Times New Roman, serif" text-anchor="middle" xml:space="preserve" >2</text><text x="360" y="104" font-size="21" font-weight="700" fill="#E6EDF3" font-family="Georgia, Times New Roman, serif" text-anchor="middle" xml:space="preserve" >Design</text><text x="360" y="130" font-size="16" font-weight="400" fill="#9198A1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve" >A clear plan, with the</text><text x="360" y="152" font-size="16" font-weight="400" fill="#9198A1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve" >price of each option</text></g><g class="in" style="animation-delay:0.24s"><circle cx="600" cy="40" r="26" fill="#0D1117" stroke="#3FB950" stroke-width="2"/><text x="600" y="50" font-size="26" font-weight="700" fill="#3FB950" font-family="Georgia, Times New Roman, serif" text-anchor="middle" xml:space="preserve" >3</text><text x="600" y="104" font-size="21" font-weight="700" fill="#E6EDF3" font-family="Georgia, Times New Roman, serif" text-anchor="middle" xml:space="preserve" >Build</text><text x="600" y="130" font-size="16" font-weight="400" fill="#9198A1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve" >Small pieces you can</text><text x="600" y="152" font-size="16" font-weight="400" fill="#9198A1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve" >try every week</text></g><g class="in" style="animation-delay:0.36s"><circle cx="840" cy="40" r="26" fill="#0D1117" stroke="#3FB950" stroke-width="2"/><text x="840" y="50" font-size="26" font-weight="700" fill="#3FB950" font-family="Georgia, Times New Roman, serif" text-anchor="middle" xml:space="preserve" >4</text><text x="840" y="104" font-size="21" font-weight="700" fill="#E6EDF3" font-family="Georgia, Times New Roman, serif" text-anchor="middle" xml:space="preserve" >Prove</text><text x="840" y="130" font-size="16" font-weight="400" fill="#9198A1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve" >Tests behind every rule,</text><text x="840" y="152" font-size="16" font-weight="400" fill="#9198A1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve" >so it keeps working</text></g><g class="in" style="animation-delay:0.48s"><circle cx="1080" cy="40" r="26" fill="#0D1117" stroke="#3FB950" stroke-width="2"/><text x="1080" y="50" font-size="26" font-weight="700" fill="#3FB950" font-family="Georgia, Times New Roman, serif" text-anchor="middle" xml:space="preserve" >5</text><text x="1080" y="104" font-size="21" font-weight="700" fill="#E6EDF3" font-family="Georgia, Times New Roman, serif" text-anchor="middle" xml:space="preserve" >Launch</text><text x="1080" y="130" font-size="16" font-weight="400" fill="#9198A1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve" >Live, written up and</text><text x="1080" y="152" font-size="16" font-weight="400" fill="#9198A1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve" >yours to run</text></g></svg>

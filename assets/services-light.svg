<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 508" width="1200" height="508"><style>@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.in{animation:in .6s ease-out both}</style><g class="in" style="animation-delay:0.0s"><g transform="translate(0 0)"><rect x=".5" y=".5" width="587" height="243" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="28" y="28" width="44" height="44" rx="6" fill="#DAFBE1"/><g transform="translate(39 39) scale(0.9166666666666666)" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5l-9 5l-9-5z M3 13l9 5l9-5 M3 17.5l9 5l9-5"/></g><text x="88" y="58" font-size="24" font-weight="700" fill="#1F2328" font-family="Georgia, Times New Roman, serif" text-anchor="start" xml:space="preserve" >One platform, many customers</text><text x="28" y="116" font-size="17" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >Every customer sees only their own data.</text><text x="28" y="144" font-size="17" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >You change prices, rules and wording</text><text x="28" y="172" font-size="17" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >yourself, with no new release.</text><text x="28" y="220" font-size="14" font-weight="400" fill="#1F2328" font-family="Consolas, Menlo, monospace" text-anchor="start" xml:space="preserve" >Django · React · PostgreSQL</text></g></g><g class="in" style="animation-delay:0.1s"><g transform="translate(612 0)"><rect x=".5" y=".5" width="587" height="243" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="28" y="28" width="44" height="44" rx="6" fill="#DAFBE1"/><g transform="translate(39 39) scale(0.9166666666666666)" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z M15 3v4h4 M9 13l2 2l4-4"/></g><text x="88" y="58" font-size="24" font-weight="700" fill="#1F2328" font-family="Georgia, Times New Roman, serif" text-anchor="start" xml:space="preserve" >Paperwork that fills itself in</text><text x="28" y="116" font-size="17" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >PDFs and phone photos turned into clean</text><text x="28" y="144" font-size="17" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >data. Every value shows where it came</text><text x="28" y="172" font-size="17" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >from, and a person checks anything unsure.</text><text x="28" y="220" font-size="14" font-weight="400" fill="#1F2328" font-family="Consolas, Menlo, monospace" text-anchor="start" xml:space="preserve" >Python · LLMs · OCR</text></g></g><g class="in" style="animation-delay:0.2s"><g transform="translate(0 264)"><rect x=".5" y=".5" width="587" height="243" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="28" y="28" width="44" height="44" rx="6" fill="#DAFBE1"/><g transform="translate(39 39) scale(0.9166666666666666)" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3 M4 4v4h4 M4 13a8 8 0 0 0 14.9 3 M20 20v-4h-4"/></g><text x="88" y="58" font-size="24" font-weight="700" fill="#1F2328" font-family="Georgia, Times New Roman, serif" text-anchor="start" xml:space="preserve" >Old code, made new again</text><text x="28" y="116" font-size="17" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >Upgrades in small, safe steps while the</text><text x="28" y="144" font-size="17" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >business keeps running, with tests proving</text><text x="28" y="172" font-size="17" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >nothing broke along the way.</text><text x="28" y="220" font-size="14" font-weight="400" fill="#1F2328" font-family="Consolas, Menlo, monospace" text-anchor="start" xml:space="preserve" >Python 3 · Django · Celery</text></g></g><g class="in" style="animation-delay:0.3s"><g transform="translate(612 264)"><rect x=".5" y=".5" width="587" height="243" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="28" y="28" width="44" height="44" rx="6" fill="#DAFBE1"/><g transform="translate(39 39) scale(0.9166666666666666)" fill="none" stroke="#1A7F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v6H4z M4 14h16v6H4z M8 7h.01 M8 17h.01"/></g><text x="88" y="58" font-size="24" font-weight="700" fill="#1F2328" font-family="Georgia, Times New Roman, serif" text-anchor="start" xml:space="preserve" >Back ends that stay up</text><text x="28" y="116" font-size="17" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >Heavy work runs in the background, every</text><text x="28" y="144" font-size="17" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >job tells you where it is, and someone</text><text x="28" y="172" font-size="17" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >hears the moment anything fails.</text><text x="28" y="220" font-size="14" font-weight="400" fill="#1F2328" font-family="Consolas, Menlo, monospace" text-anchor="start" xml:space="preserve" >FastAPI · RabbitMQ · AWS</text></g></g></svg>

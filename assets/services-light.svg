<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 586" width="1200" height="586" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"><style>@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}</style><defs><linearGradient id="h0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient><linearGradient id="h1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient><linearGradient id="h2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#EF4444"/></linearGradient><linearGradient id="h3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#06B6D4"/></linearGradient><linearGradient id="h4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#14B8A6"/></linearGradient><linearGradient id="h5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity=".10"/></filter><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter></defs><g class="up" style="animation-delay:0.00s"><g transform="translate(6 10)"><rect width="582" height="266" rx="20" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow)"/><rect x="24" y="0" width="534" height="4" rx="2" fill="url(#h0)"/><rect x="28" y="30" width="56" height="56" rx="16" fill="url(#h0)"/><g transform="translate(42.0 44.0) scale(1.1666666666666667)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5l-9 5l-9-5z M3 13l9 5l9-5 M3 17.5l9 5l9-5"/></g><text x="100" y="66" font-size="23" font-weight="800" fill="#111827" text-anchor="start" >One platform, many customers</text><text x="28" y="128" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start" >Every customer sees only their own data.</text><text x="28" y="156" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start" >You change prices, rules and wording</text><text x="28" y="184" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start" >yourself, with no new release.</text><rect x="28" y="214" width="75" height="30" rx="15" fill="#F3F4F6" stroke="#E5E7EB"/><text x="65.6" y="234" font-size="14" font-weight="600" fill="#4B5563" text-anchor="middle" >Django</text><rect x="111.19999999999999" y="214" width="67" height="30" rx="15" fill="#F3F4F6" stroke="#E5E7EB"/><text x="144.7" y="234" font-size="14" font-weight="600" fill="#4B5563" text-anchor="middle" >React</text><rect x="186.2" y="214" width="108" height="30" rx="15" fill="#F3F4F6" stroke="#E5E7EB"/><text x="240.2" y="234" font-size="14" font-weight="600" fill="#4B5563" text-anchor="middle" >PostgreSQL</text></g></g><g class="up" style="animation-delay:0.12s"><g transform="translate(612 10)"><rect width="582" height="266" rx="20" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow)"/><rect x="24" y="0" width="534" height="4" rx="2" fill="url(#h1)"/><rect x="28" y="30" width="56" height="56" rx="16" fill="url(#h1)"/><g transform="translate(42.0 44.0) scale(1.1666666666666667)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z M15 3v4h4 M9 13l2 2l4-4"/></g><text x="100" y="66" font-size="23" font-weight="800" fill="#111827" text-anchor="start" >Paperwork that fills itself in</text><text x="28" y="128" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start" >PDFs and phone photos turned into clean</text><text x="28" y="156" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start" >data. Every value shows where it came</text><text x="28" y="184" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start" >from, and a person signs off the unsure.</text><rect x="28" y="214" width="75" height="30" rx="15" fill="#F3F4F6" stroke="#E5E7EB"/><text x="65.6" y="234" font-size="14" font-weight="600" fill="#4B5563" text-anchor="middle" >Python</text><rect x="111.19999999999999" y="214" width="59" height="30" rx="15" fill="#F3F4F6" stroke="#E5E7EB"/><text x="140.6" y="234" font-size="14" font-weight="600" fill="#4B5563" text-anchor="middle" >LLMs</text><rect x="178.0" y="214" width="51" height="30" rx="15" fill="#F3F4F6" stroke="#E5E7EB"/><text x="203.3" y="234" font-size="14" font-weight="600" fill="#4B5563" text-anchor="middle" >OCR</text></g></g><g class="up" style="animation-delay:0.24s"><g transform="translate(6 300)"><rect width="582" height="266" rx="20" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow)"/><rect x="24" y="0" width="534" height="4" rx="2" fill="url(#h2)"/><rect x="28" y="30" width="56" height="56" rx="16" fill="url(#h2)"/><g transform="translate(42.0 44.0) scale(1.1666666666666667)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3 M4 4v4h4 M4 13a8 8 0 0 0 14.9 3 M20 20v-4h-4"/></g><text x="100" y="66" font-size="23" font-weight="800" fill="#111827" text-anchor="start" >Old code, made new again</text><text x="28" y="128" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start" >Upgrades in small, safe steps while the</text><text x="28" y="156" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start" >business keeps running, with tests proving</text><text x="28" y="184" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start" >nothing broke along the way.</text><rect x="28" y="214" width="92" height="30" rx="15" fill="#F3F4F6" stroke="#E5E7EB"/><text x="73.8" y="234" font-size="14" font-weight="600" fill="#4B5563" text-anchor="middle" >Python 3</text><rect x="127.6" y="214" width="75" height="30" rx="15" fill="#F3F4F6" stroke="#E5E7EB"/><text x="165.2" y="234" font-size="14" font-weight="600" fill="#4B5563" text-anchor="middle" >Django</text><rect x="210.79999999999998" y="214" width="75" height="30" rx="15" fill="#F3F4F6" stroke="#E5E7EB"/><text x="248.39999999999998" y="234" font-size="14" font-weight="600" fill="#4B5563" text-anchor="middle" >Celery</text></g></g><g class="up" style="animation-delay:0.36s"><g transform="translate(612 300)"><rect width="582" height="266" rx="20" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow)"/><rect x="24" y="0" width="534" height="4" rx="2" fill="url(#h3)"/><rect x="28" y="30" width="56" height="56" rx="16" fill="url(#h3)"/><g transform="translate(42.0 44.0) scale(1.1666666666666667)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v6H4z M4 14h16v6H4z M8 7h.01 M8 17h.01"/></g><text x="100" y="66" font-size="23" font-weight="800" fill="#111827" text-anchor="start" >Back ends that stay up</text><text x="28" y="128" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start" >Heavy work runs in the background, every</text><text x="28" y="156" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start" >job tells you where it is, and someone</text><text x="28" y="184" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start" >hears the moment anything fails.</text><rect x="28" y="214" width="83" height="30" rx="15" fill="#F3F4F6" stroke="#E5E7EB"/><text x="69.69999999999999" y="234" font-size="14" font-weight="600" fill="#4B5563" text-anchor="middle" >FastAPI</text><rect x="119.39999999999999" y="214" width="92" height="30" rx="15" fill="#F3F4F6" stroke="#E5E7EB"/><text x="165.2" y="234" font-size="14" font-weight="600" fill="#4B5563" text-anchor="middle" >RabbitMQ</text><rect x="219.0" y="214" width="51" height="30" rx="15" fill="#F3F4F6" stroke="#E5E7EB"/><text x="244.3" y="234" font-size="14" font-weight="600" fill="#4B5563" text-anchor="middle" >AWS</text></g></g></svg>

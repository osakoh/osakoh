<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"><style>@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}@keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,26px)}}.drift{animation:drift 9s ease-in-out infinite alternate}.drift2{animation:drift 11s ease-in-out infinite alternate-reverse}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}.pulse{transform-origin:997px 115px;animation:pulse 2.4s ease-in-out infinite}</style><defs><linearGradient id="h0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient><linearGradient id="h1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient><linearGradient id="h2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#EF4444"/></linearGradient><linearGradient id="h3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#06B6D4"/></linearGradient><linearGradient id="h4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#14B8A6"/></linearGradient><linearGradient id="h5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity=".10"/></filter><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter></defs><rect width="1200" height="230" rx="26" fill="#0B1020"/><g filter="url(#blur)"><circle class="drift" cx="120" cy="200" r="150" fill="#8B5CF6" opacity=".55"/><circle class="drift2" cx="1100" cy="30" r="160" fill="#14B8A6" opacity=".5"/></g><rect width="1200" height="230" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/><text x="60" y="92" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="start" >Got something that needs building?</text><text x="60" y="134" font-size="19" font-weight="400" fill="#E2E8F0" text-anchor="start" >Send two lines: what is slowing you down, and when you need it fixed.</text><text x="60" y="166" font-size="19" font-weight="400" fill="#E2E8F0" text-anchor="start" >You get a straight answer, not a sales pitch.</text><g class="pulse"><rect x="852" y="80" width="290" height="70" rx="35" fill="url(#h2)" filter="url(#shadow)"/><g transform="translate(890 102) scale(1.0833333333333333)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3z M3 7l9 6l9-6"/></g><text x="1014" y="124" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle" >Email me</text></g></svg>

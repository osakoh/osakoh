<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190"><style>@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.in{animation:in .6s ease-out both}</style><g class="in" style="animation-delay:0.0s"><g transform="translate(0 0)"><rect x=".5" y=".5" width="1199" height="189" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="0" y="0" width="5" height="190" rx="2" fill="#1A7F37"/><text x="48" y="74" font-size="34" font-weight="700" fill="#1F2328" font-family="Georgia, Times New Roman, serif" text-anchor="start" xml:space="preserve" >Got something that needs building?</text><text x="48" y="114" font-size="18" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >Send two lines: what is slowing you down, and when you need it fixed.</text><text x="48" y="142" font-size="18" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >You get a straight answer, not a sales pitch.</text><rect x="900" y="62" width="250" height="64" rx="6" fill="#1A7F37"/><g transform="translate(952 82) scale(1.0)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3z M3 7l9 6l9-6"/></g><text x="1040" y="102" font-size="22" font-weight="700" fill="#FFFFFF" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve" >Email me</text></g></g></svg>

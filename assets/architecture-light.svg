<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"><style>@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}@keyframes packet{from{stroke-dashoffset:50}to{stroke-dashoffset:0}}.packet{animation:packet 1.2s linear infinite}@keyframes glow{0%,100%{opacity:1}50%{opacity:.82}}.node{animation:glow 4s ease-in-out infinite}</style><defs><linearGradient id="h0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient><linearGradient id="h1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient><linearGradient id="h2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#EF4444"/></linearGradient><linearGradient id="h3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#06B6D4"/></linearGradient><linearGradient id="h4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#14B8A6"/></linearGradient><linearGradient id="h5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity=".10"/></filter><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter></defs><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4B5563"/></marker></defs><rect x="250" y="20" width="940" height="440" rx="22" fill="none" stroke="#4B5563" stroke-width="2" stroke-dasharray="10 8" opacity=".55"/><text x="274" y="50" font-size="15" font-weight="800" fill="#4B5563" text-anchor="start" >Your platform  [Software System]</text><path d="M200 230 L294 230" fill="none" stroke="#4B5563" stroke-width="2" opacity=".45" marker-end="url(#tip)"/><path class="packet" style="animation-delay:0.00s" d="M200 230 L294 230" fill="none" stroke="url(#h0)" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 40"/><rect x="224" y="198" width="49" height="24" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/><text x="248" y="214" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" >uses</text><path d="M506 230 L584 230" fill="none" stroke="#4B5563" stroke-width="2" opacity=".45" marker-end="url(#tip)"/><path class="packet" style="animation-delay:0.25s" d="M506 230 L584 230" fill="none" stroke="url(#h0)" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 40"/><rect x="522" y="198" width="49" height="24" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/><text x="546" y="214" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" >JSON</text><path d="M796 205 L898 110" fill="none" stroke="#4B5563" stroke-width="2" opacity=".45" marker-end="url(#tip)"/><path class="packet" style="animation-delay:0.50s" d="M796 205 L898 110" fill="none" stroke="url(#h0)" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 40"/><rect x="789" y="134" width="114" height="24" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/><text x="846" y="150" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" >reads, writes</text><path d="M796 240 L898 240" fill="none" stroke="#4B5563" stroke-width="2" opacity=".45" marker-end="url(#tip)"/><path class="packet" style="animation-delay:0.75s" d="M796 240 L898 240" fill="none" stroke="url(#h0)" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 40"/><rect x="798" y="212" width="99" height="24" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/><text x="848" y="228" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" >queues jobs</text><path d="M1025 290 L1025 338" fill="none" stroke="#4B5563" stroke-width="2" opacity=".45" marker-end="url(#tip)"/><path class="packet" style="animation-delay:1.00s" d="M1025 290 L1025 338" fill="none" stroke="url(#h0)" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 40"/><path d="M900 395 L234 395" fill="none" stroke="#4B5563" stroke-width="2" opacity=".45" marker-end="url(#tip)"/><path class="packet" style="animation-delay:1.25s" d="M900 395 L234 395" fill="none" stroke="url(#h0)" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 40"/><rect x="456" y="387" width="207" height="24" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/><text x="560" y="403" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" >asks it to read a document</text><path d="M1150 395 L1172 395 L1172 90 L1152 90" fill="none" stroke="#4B5563" stroke-width="2" opacity=".45" marker-end="url(#tip)"/><path class="packet" style="animation-delay:1.50s" d="M1150 395 L1172 395 L1172 90 L1152 90" fill="none" stroke="url(#h0)" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 40"/><rect x="1031" y="156" width="114" height="24" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/><text x="1088" y="172" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" >saves results</text><circle cx="115" cy="182" r="22" fill="url(#h5)"/><rect x="30" y="208" width="170" height="92" rx="24" fill="url(#h5)" filter="url(#shadow)"/><text x="115" y="242" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle" >Your customer</text><text x="115" y="264" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" >[Person]</text><text x="115" y="286" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle" >uploads, reviews</text><g class="node" style="animation-delay:0.0s"><rect x="296" y="176" width="210" height="108" rx="16" fill="url(#h0)" stroke="#E5E7EB"  filter="url(#shadow)"/><text x="401.0" y="212" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle" >Web app</text><text x="401.0" y="236" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity=".9">[Container: Next.js, React]</text><text x="401.0" y="262" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle" >screens they use</text></g><g class="node" style="animation-delay:1.2s"><rect x="586" y="176" width="210" height="108" rx="16" fill="url(#h1)" stroke="#E5E7EB"  filter="url(#shadow)"/><text x="691.0" y="212" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle" >API</text><text x="691.0" y="236" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity=".9">[Container: Django REST]</text><text x="691.0" y="262" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle" >rules and permissions</text></g><g class="node" style="animation-delay:3.6s"><rect x="900" y="40" width="250" height="100" rx="16" fill="url(#h3)" stroke="#E5E7EB"  filter="url(#shadow)"/><text x="1025.0" y="76" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle" >Database</text><text x="1025.0" y="100" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity=".9">[Container: PostgreSQL]</text><text x="1025.0" y="126" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle" >each customer kept apart</text></g><g class="node" style="animation-delay:2.4s"><rect x="900" y="190" width="250" height="100" rx="16" fill="url(#h2)" stroke="#E5E7EB"  filter="url(#shadow)"/><text x="1025.0" y="226" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle" >Job queue</text><text x="1025.0" y="250" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity=".9">[Container: Redis, RabbitMQ]</text><text x="1025.0" y="276" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle" >heavy work waits here</text></g><g class="node" style="animation-delay:4.8s"><rect x="900" y="340" width="250" height="100" rx="16" fill="url(#h4)" stroke="#E5E7EB"  filter="url(#shadow)"/><text x="1025.0" y="376" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle" >Workers</text><text x="1025.0" y="400" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity=".9">[Container: Celery]</text><text x="1025.0" y="426" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle" >read, check, retry</text></g><g class="node" style="animation-delay:6.0s"><rect x="30" y="350" width="200" height="90" rx="16" fill="#F3F4F6" stroke="#E5E7EB" stroke-dasharray="6 5" filter="url(#shadow)"/><text x="130.0" y="386" font-size="19" font-weight="800" fill="#111827" text-anchor="middle" >AI provider</text><text x="130.0" y="410" font-size="13" font-weight="600" fill="#111827" text-anchor="middle" opacity=".9">[External system]</text><text x="130.0" y="436" font-size="14" font-weight="400" fill="#111827" text-anchor="middle" >backup ready</text></g></svg>

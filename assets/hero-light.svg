<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400"><style>@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.in{animation:in .6s ease-out both}@keyframes blink{50%{opacity:0}}.caret{animation:blink 1.1s steps(1) infinite}@keyframes breathe{50%{opacity:.35}}.dot{animation:breathe 2.4s ease-in-out infinite}</style><rect x=".5" y=".5" width="1199" height="399" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><text x="60" y="76" font-size="14" font-weight="700" fill="#1A7F37" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" letter-spacing="2.5">INDEPENDENT SOFTWARE CONSULTANT</text><text x="60" y="140" font-size="44" font-weight="700" fill="#1F2328" font-family="Georgia, Times New Roman, serif" text-anchor="start" xml:space="preserve" >You bring the problem.</text><text x="60" y="194" font-size="44" font-weight="700" fill="#1A7F37" font-family="Georgia, Times New Roman, serif" text-anchor="start" xml:space="preserve" >I ship the software</text><text x="60" y="248" font-size="44" font-weight="700" fill="#1A7F37" font-family="Georgia, Times New Roman, serif" text-anchor="start" xml:space="preserve" >that fixes it.</text><text x="60" y="296" font-size="19" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >I build web platforms, tools that read your paperwork,</text><text x="60" y="324" font-size="19" font-weight="400" fill="#59636E" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >and careful upgrades for old code. Remote, worldwide.</text><circle class="dot" cx="68" cy="364" r="6" fill="#1A7F37"/><text x="84" y="370" font-size="17" font-weight="600" fill="#1F2328" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve" >Available for new projects</text><g transform="translate(800 48)"><rect x=".5" y=".5" width="349" height="303" rx="6" fill="#F6F8FA" stroke="#D0D7DE"/><text x="22" y="30" font-size="13" font-weight="400" fill="#59636E" font-family="Consolas, Menlo, monospace" text-anchor="start" xml:space="preserve" >invoices/reader.py</text><line x1="0" y1="46" x2="350" y2="46" stroke="#D0D7DE"/><text x="22" y="84" font-size="15" font-weight="400" fill="#1F2328" font-family="Consolas, Menlo, monospace" text-anchor="start" xml:space="preserve" class="in" style="animation-delay:0.20s">def read_invoice(document):</text><text x="22" y="110" font-size="15" font-weight="400" fill="#1F2328" font-family="Consolas, Menlo, monospace" text-anchor="start" xml:space="preserve" class="in" style="animation-delay:0.32s">    fields = reader.read(document)</text><text x="22" y="136" font-size="15" font-weight="400" fill="#1F2328" font-family="Consolas, Menlo, monospace" text-anchor="start" xml:space="preserve" class="in" style="animation-delay:0.44s"></text><text x="22" y="162" font-size="15" font-weight="400" fill="#59636E" font-family="Consolas, Menlo, monospace" text-anchor="start" xml:space="preserve" class="in" style="animation-delay:0.56s">    # not sure? a person checks it</text><text x="22" y="188" font-size="15" font-weight="400" fill="#1F2328" font-family="Consolas, Menlo, monospace" text-anchor="start" xml:space="preserve" class="in" style="animation-delay:0.68s">    if fields.confidence == "low":</text><text x="22" y="214" font-size="15" font-weight="400" fill="#1F2328" font-family="Consolas, Menlo, monospace" text-anchor="start" xml:space="preserve" class="in" style="animation-delay:0.80s">        return ask_a_person(fields)</text><text x="22" y="240" font-size="15" font-weight="400" fill="#1F2328" font-family="Consolas, Menlo, monospace" text-anchor="start" xml:space="preserve" class="in" style="animation-delay:0.92s"></text><text x="22" y="266" font-size="15" font-weight="400" fill="#1F2328" font-family="Consolas, Menlo, monospace" text-anchor="start" xml:space="preserve" class="in" style="animation-delay:1.04s">    return save(fields)</text><rect class="caret" x="234" y="252" width="9" height="18" fill="#1A7F37"/></g></svg>
